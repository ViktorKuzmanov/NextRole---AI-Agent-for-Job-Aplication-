[project]
name = "nextrole"
version = "0.1.0"
description = "AI agent that finds, classifies and applies to jobs (LangGraph + LangChain)"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.2",
    "langchain>=1.5",
    "langchain-anthropic>=1.7",
    "httpx>=0.28",
    "pyyaml>=6",
    "python-dotenv>=1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
nextrole = "nextrole.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
